  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色：疗愈风 - 鼠尾草绿 + 奶油 + 土色 === */
      --color-primary:              #8FA68E;
      --color-primary-container:    #DEE5D9;
      --color-on-primary:           #ffffff;
      --color-secondary:            #B88466;
      --color-secondary-container:  #EDDDD2;
      --color-on-secondary:         #ffffff;
      /* === 背景 / 表面（暖米色系，色阶克制） === */
      --color-background:                 #F4EFE6;
      --color-surface-container-lowest:   #FBF8F1;
      --color-surface:                    #FFF9EF;
      --color-surface-container:          #ECE5D9;
      --color-surface-container-high:     #E5DDCF;
      --color-surface-container-highest:  #DED5C6;
      /* === 文字（暖棕） === */
      --color-on-surface:           #2F2A24;
      --color-on-surface-variant:   #7D746B;
      /* === 功能色 === */
      --color-success:  #6FA05C;
      --color-error:    #C4554D;
      --color-warning:  #D99A3D;
      /* === 边框 === */
      --color-outline:          #C9BFAD;
      --color-outline-variant:  #D8D0C1;
      /* === 圆角 === */
      --radius-sm:   0.75rem;
      --radius-md:   1rem;
      --radius-lg:   1.25rem;
      --radius-xl:   1.5rem;
      --radius-2xl:  1.75rem;
      --radius-full: 9999px;
      /* === 阴影（暖调低透明） === */
      --shadow-card:   0 4px 14px rgba(82,72,60,0.08);
      --shadow-float:  0 12px 28px rgba(82,72,60,0.12);
      --shadow-dialog: 0 25px 50px rgba(82,72,60,0.18);
      /* === 字体 === */
      --font-sans: "Nunito", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
      --font-display: "Noto Serif SC", serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
    /* 纯 CSS 滚动条美化，用于聊天区等 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>
